# Generated by scripts/dependabot.sh from images.json; test/check-images.sh fails when it is out of date.
# Regenerate after adding or removing an image: scripts/dependabot.sh > .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The FROM lines of every image. A tag names its runtime's version (java_8, python_3.12, dotnet_8), so only patch
  # updates of a base tag are proposed; moving a tag to a new major/minor base is a deliberate change (a new tag or
  # an edited Dockerfile). Floating tags (debian:bookworm-slim) are refreshed by the weekly rebuild instead.
  - package-ecosystem: docker
    directories:
      - /images/alpine
      - /images/debian
      - /images/dotnet_10
      - /images/dotnet_8
      - /images/go_1.23
      - /images/installer_alpine
      - /images/installer_debian
      - /images/installer_java_11
      - /images/installer_java_21
      - /images/installer_java_8
      - /images/java_11
      - /images/java_17
      - /images/java_21
      - /images/java_25
      - /images/java_8
      - /images/mono
      - /images/nodejs_20
      - /images/nodejs_22
      - /images/proton
      - /images/python_3.12
      - /images/rust
      - /images/source
      - /images/steamcmd_debian
      - /images/steamcmd_dotnet
      - /images/steamcmd_sniper
      - /images/steamcmd_ubuntu
      - /images/wine
      - /images/wine_staging
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: images
